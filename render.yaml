services:
  - type: web
    name: qlearn-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: python -m pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./quantum_edu.db
      - key: CORS_ORIGINS
        value: "*"
